<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Tiwaton Adventure</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;800&family=Pacifico&display=swap"
    rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Baloo 2"', 'sans-serif'],
            display: ['Pacifico', 'cursive'],
          },
          animation: {
            'float': 'float 6s ease-in-out infinite',
            'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            'scale-in': 'scaleIn 0.3s cubic-bezier(0.16, 1, 0.3, 1)',
            'blob': 'blob 7s infinite',
            'twinkle': 'twinkle 4s ease-in-out infinite',
            'float-slow': 'floatSlow 8s ease-in-out infinite',
            'spin-slow': 'spinSlow 12s linear infinite',
            'bounce-soft': 'bounceSoft 4s ease-in-out infinite',
          },
          keyframes: {
            floatSlow: {
              '0%, 100%': { transform: 'translate(0, 0)' },
              '50%': { transform: 'translate(30px, -20px)' },
            },
            spinSlow: {
              '0%': { transform: 'rotate(0deg)' },
              '100%': { transform: 'rotate(360deg)' },
            },
            bounceSoft: {
              '0%, 100%': { transform: 'translateY(0) scale(1)' },
              '50%': { transform: 'translateY(-15px) scale(1.05)' },
            },
            float: {
              '0%, 100%': { transform: 'translateY(0)' },
              '50%': { transform: 'translateY(-10px)' },
            },
            scaleIn: {
              '0%': { transform: 'scale(0.8)', opacity: '0' },
              '100%': { transform: 'scale(1)', opacity: '1' }
            },
            blob: {
              '0%': { transform: 'translate(0px, 0px) scale(1)' },
              '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
              '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
              '100%': { transform: 'translate(0px, 0px) scale(1)' },
            },
            twinkle: {
              '0%, 100%': { opacity: '0.2', transform: 'scale(0.8)' },
              '50%': { opacity: '1', transform: 'scale(1.2)' },
            },
          }
        }
      }
    }
  </script>
  <style>
    .animation-delay-2000 {
      animation-delay: 2s;
    }

    .animation-delay-4000 {
      animation-delay: 4s;
    }

    :root {
      --sat: env(safe-area-inset-top);
      --sar: env(safe-area-inset-right);
      --sab: env(safe-area-inset-bottom);
      --sal: env(safe-area-inset-left);
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      min-height: -webkit-fill-available;
      overscroll-behavior: none;
      touch-action: pan-x pan-y;
      -webkit-tap-highlight-color: transparent;
      background-color: #050810;
      overflow: hidden;
    }

    body {
      color: white;
    }

    #root {
      height: 100%;
      width: 100%;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(99, 102, 241, 0.3);
      border-radius: 10px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: rgba(99, 102, 241, 0.5);
    }

    .safe-top {
      padding-top: var(--sat);
    }

    .safe-bottom {
      padding-bottom: var(--sab);
    }

    /* --- GLOBAL TOOLTIP SYSTEM --- */
    [data-tooltip] {
      position: relative;
    }

    [data-tooltip]::after {
      content: attr(data-tooltip);
      position: absolute;
      bottom: 125%;
      left: 50%;
      transform: translateX(-50%) translateY(10px);
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(12px);
      color: white;
      padding: 8px 14px;
      border-radius: 12px;
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      border: 1px solid rgba(129, 140, 248, 0.3);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 20px rgba(99, 102, 241, 0.1);
      z-index: 1000;
      line-height: 1.2;
      text-align: center;
    }

    /* Handle tooltips near the top edge */
    [data-tooltip-pos="bottom"]::after {
      bottom: auto;
      top: 125%;
      transform: translateX(-50%) translateY(-10px);
    }

    [data-tooltip]:hover::after {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
      transition-delay: 0.2s;
    }

    /* Mobile optimization: hide tooltips on small touch screens if they overlap */
    @media (max-width: 640px) {
      [data-tooltip]::after {
        display: none;
      }
    }

    /* Startup fallback so mobile never shows a blank dark screen */
    #boot-fallback {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, #1e1b4b 0%, #0f172a 45%, #020617 100%);
      color: #e2e8f0;
      padding: 24px;
    }

    .boot-card {
      width: min(92vw, 420px);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 20px;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(6px);
      padding: 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
      text-align: center;
      font-family: "Baloo 2", sans-serif;
    }

    .boot-title {
      font-size: 28px;
      margin: 0 0 8px;
      color: #c4b5fd;
      font-family: Pacifico, cursive;
    }

    .boot-sub {
      margin: 0;
      font-size: 14px;
      color: #cbd5e1;
    }
  </style>
</head>

<body>
  <div id="root">
    <div id="boot-fallback" role="status" aria-live="polite">
      <div class="boot-card">
        <h1 class="boot-title">Adventure Hub</h1>
        <p class="boot-sub">Loading your adventure…</p>
      </div>
    </div>
  </div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
